name: NORTHSTAR API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/api-ci.yml"
      - ".env.example"

permissions:
  contents: read

jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services/api
      APP_ENV: test
      DATABASE_URL: sqlite:///./northstar_ci.sqlite3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic -c services/api/alembic.ini upgrade head

      - name: Run SQLite API tests
        run: python -m pytest services/api/tests -q

  postgres-security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northstar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: services/api
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://northstar_app:northstar_app_test@127.0.0.1:5432/northstar
      NORTHSTAR_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/northstar

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Apply PostgreSQL migrations as database administrator
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/northstar
        run: python -m alembic -c services/api/alembic.ini upgrade head

      - name: Create restricted application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d northstar -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE northstar_app LOGIN PASSWORD 'northstar_app_test'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE northstar TO northstar_app;
          GRANT USAGE ON SCHEMA public TO northstar_app;
          GRANT SELECT ON tenants, sites, user_memberships TO northstar_app;
          GRANT SELECT, INSERT ON audit_events TO northstar_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON api_rate_limit_buckets TO northstar_app;
          SQL

      - name: Run PostgreSQL RLS and API security tests as restricted role
        run: python -m pytest services/api/tests -q
